function useDrag(items,setItems,onDone){
  const[dId,setD]=useState(null);const[gh,setGh]=useState(null);const[ins,setIns]=useState(null);
  const refs=useRef({});const scr=useRef(null);
  const reg=useCallback(id=>el=>{if(el)refs.current[id]=el},[]);
  const idxY=useCallback(cy=>{for(let i=0;i<items.length;i++){const el=refs.current[items[i].id];if(!el)continue;const r=el.getBoundingClientRect();if(cy<r.top+r.height/2)return i}return items.length},[items]);
  const onDn=useCallback(id=>e=>{if(e.target.closest("a,button,input,textarea,select,.ec,.card-edit"))return;e.preventDefault();setD(id);setGh({x:e.clientX,y:e.clientY})},[]);
  const onMv=useCallback(e=>{if(!dId)return;setGh({x:e.clientX,y:e.clientY});setIns(idxY(e.clientY));const th=55;if(e.clientY<th){if(!scr.current)scr.current=setInterval(()=>window.scrollBy(0,-7),16)}else if(e.clientY>window.innerHeight-th){if(!scr.current)scr.current=setInterval(()=>window.scrollBy(0,7),16)}else if(scr.current){clearInterval(scr.current);scr.current=null}},[dId,idxY]);
  const onUp=useCallback(()=>{if(scr.current){clearInterval(scr.current);scr.current=null}if(!dId||ins===null){setD(null);setGh(null);setIns(null);return}const from=items.findIndex(i=>i.id===dId);if(from!==-1&&ins!==from&&ins!==from+1){const n=[...items];const[m]=n.splice(from,1);n.splice(ins>from?ins-1:ins,0,m);setItems(n);onDone?.()}setD(null);setGh(null);setIns(null)},[dId,ins,items,setItems,onDone]);
  useEffect(()=>{if(!dId)return;window.addEventListener("pointermove",onMv);window.addEventListener("pointerup",onUp);return()=>{window.removeEventListener("pointermove",onMv);window.removeEventListener("pointerup",onUp)}},[dId,onMv,onUp]);
  return{dId,gh,ins,reg,onDn};
}

.ext{color:var(--t3);opacity:0;transition:all .12s;padding:4px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.card:hover .ext{opacity:.5}.ext:hover{opacity:1!important;color:var(--ac);background:var(--al)}
.gh{position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-120%)}
.ghs{display:block;max-width:340px;padding:7px 12px;background:var(--sf);border:1.5px solid var(--ac);border-radius:var(--rs);box-shadow:0 8px 24px rgba(0,0,0,.15);font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tst{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:9px 18px;background:var(--t1);color:#fff;border-radius:8px;font-size:12.5px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.15);display:flex;align-items:center;gap:6px;z-index:600;animation:ti .25s ease,to .25s ease 2.1s forwards}
@keyframes ti{from{transform:translateX(-50%) translateY(16px);opacity:0}to{transform:translateX(-50%);opacity:1}}
@keyframes to{to{transform:translateX(-50%) translateY(16px);opacity:0}}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:1000;animation:mf .12s ease;padding:16px}
@keyframes mf{from{opacity:0}to{opacity:1}}
.mob{background:var(--sf);border-radius:14px;width:100%;max-width:560px;box-shadow:0 12px 40px rgba(0,0,0,.15);animation:msl .18s ease;overflow-y:auto;max-height:90vh}
@keyframes msl{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.moh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}.moh h3{font-size:15px;font-weight:700}
.mox{background:none;border:none;font-size:20px;color:var(--t3);cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px}.mox:hover{background:var(--bg)}
.mod{padding:14px 20px;display:flex;flex-direction:column;gap:10px}
.mof{padding:12px 20px 16px;display:flex;align-items:center;gap:8px}
.fr{display:flex;gap:8px;flex-wrap:wrap}
.ff{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 100px}.ff.g1{flex:1 1 180px}.ff.g2{flex:1 1 100%}
.ff span{font-size:11px;font-weight:600;color:var(--t2)}
.ff input,.ff select,.ff textarea{padding:7px 10px;border:1.2px solid var(--bd);border-radius:var(--rs);font-size:12.5px;font-family:inherit;outline:none;color:var(--t1);background:var(--sf);transition:border-color .12s;width:100%}
.ff input::placeholder,.ff textarea::placeholder{color:var(--t3)}.ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--ac)}
.ff textarea{resize:vertical;min-height:36px}
.msep{height:1px;background:var(--bd);margin:2px 0}
.tag-field{display:flex;flex-direction:column;gap:5px}.tag-label{font-size:11px;font-weight:600;color:var(--t2)}
.tag-checks{display:flex;gap:8px;flex-wrap:wrap}
.tag-ck{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border:1.2px solid var(--bd);border-radius:var(--rs);font-size:12.5px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .12s;user-select:none}
.tag-ck:hover{border-color:var(--bh)}.tag-ck.on{border-color:var(--ac);color:var(--ac);background:var(--al);font-weight:600}
.tag-ck .ckb{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;transition:all .1s;flex-shrink:0}
.tag-ck.on .ckb{border-color:var(--ac);background:var(--ac)}
.empty{text-align:center;padding:50px 20px;color:var(--t3)}.empty p{font-size:13px;margin-top:5px;line-height:1.6}
@media(max-width:640px){.w{padding:14px 10px 80px}.tid{max-width:160px}.fg{gap:3px 8px}.hd-t{flex-direction:column;align-items:flex-start}}
    `}</style>
    <div className="w">
      <header className="hd">
        <div className="hd-t">
          <div className="hd-l"><div className="lo">P</div><h1>Priority Board</h1></div>
          <button className="btn-p" onClick={()=>setShowAdd(true)}><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>Task 추가</button>
        </div>
        <p className="hd-s">2026 계획&우선순위 · 드래그앤드롭 우선순위 관리</p>
      </header>
      {tasks.length>0&&<div className="fil">
        <button className={`fc ${!filterWf?"on":""}`} onClick={()=>setFilterWf(null)}>전체 <span className="n">{hideComplete?tasks.filter(t=>!EXCLUDED_WF.includes(t.workflowStatus)).length:tasks.length}</span></button>
        {activeWf.map(s=>wfCounts[s]>0&&<button key={s} className={`fc ${filterWf===s?"on":""}`} onClick={()=>setFilterWf(filterWf===s?null:s)}>{s} <span className="n">{wfCounts[s]}</span></button>)}
        <div className="fs"/>
        <button className={`fh ${hideComplete?"on":""}`} onClick={()=>{setHideComplete(h=>!h);if(EXCLUDED_WF.includes(filterWf))setFilterWf(null)}}>
          <span className="ck">{hideComplete&&<svg width="9" height="9" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}</span>
          완료 제외 {wfCounts["완료"]>0&&<span className="n">{wfCounts["완료"]}</span>}
        </button>
      </div>}
      {visible.length>0&&<div className="cnt">표시 중 <strong>{visible.length}</strong>건</div>}
      <div className="tl">
        {visible.length===0?<div className="empty"><p>표시할 Task가 없습니다.</p></div>:visible.map((task,idx)=>(
          <div key={task.id}>
            {dId&&ins===idx&&<div className="dl"/>}
            <Card task={task} rank={idx+1} isDrag={dId===task.id} allTags={allTags} onPD={onDn(task.id)} regRef={reg(task.id)} onEdit={setEditTask}/>
            {dId&&ins===visible.length&&idx===visible.length-1&&<div className="dl"/>}
          </div>
        ))}
      </div>
    </div>
    {dragTask&&gh&&<div className="gh" style={{left:gh.x,top:gh.y}}><span className="ghs">{dragTask.subject}</span></div>}
    {toast&&<div className="tst" key={toast.k}><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>{toast.msg}</div>}
    {showAdd&&<TaskModal onSave={handleAdd} onClose={()=>setShowAdd(false)} isEdit={false}/>}
    {editTask&&<TaskModal task={editTask} onSave={handleSaveEdit} onDelete={handleDelete} onClose={()=>setEditTask(null)} isEdit={true}/>}
    </>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
